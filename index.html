<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thread & Beads — Content Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --linen:#F1EADC;
  --card:#FFFDF7;
  --ink:#2B2A28;
  --ink-soft:#6B655C;
  --berry:#8B3A42;
  --teal:#2C6E68;
  --mustard:#C9A227;
  --line:#DED4C0;
  --rose:#C97C7C;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--linen); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
.wrap{max-width:1000px; margin:0 auto; padding:24px 16px 80px;}

header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
.brand-eyebrow{font-family:'Space Mono',monospace; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--berry); margin:0 0 4px;}
h1{font-family:'Instrument Serif', serif; font-weight:400; font-size:50px; margin:0; line-height:1.02;}
h1 em{font-style:italic; color:var(--teal);}
.tagline{color:var(--ink-soft); font-size:17px; margin:6px 0 0; max-width:420px;}

/* stitched divider */
.stitch{height:14px; margin:20px 0 22px; position:relative;}
.stitch svg{width:100%; height:100%; display:block;}

nav.tabs{display:flex; gap:6px; margin-bottom:20px;}
nav.tabs button{
  font-family:'Space Mono',monospace; font-size:14px; letter-spacing:.05em; text-transform:uppercase;
  background:transparent; border:1px solid var(--line); color:var(--ink-soft);
  padding:9px 16px; border-radius:100px; cursor:pointer; transition:all .15s ease;
}
nav.tabs button.active{background:var(--ink); color:var(--linen); border-color:var(--ink);}

.view{display:none;} .view.active{display:block;}

/* Calendar */
.week-scroll{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:10px; overflow-x:auto; padding-bottom:8px;}
@media (max-width:820px){ .week-scroll{grid-auto-columns:78vw; grid-template-columns:none; grid-auto-flow:column;} }

.day-col{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:220px; display:flex; flex-direction:column; gap:10px;}
.day-head{display:flex; align-items:baseline; justify-content:space-between;}
.day-name{font-family:'Space Mono',monospace; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
.day-pillar{font-family:'Instrument Serif',serif; font-size:18px; font-style:italic; color:var(--berry);}
.day-col.today{border-color:var(--teal); box-shadow:0 0 0 2px rgba(44,110,104,0.12);}

.card{background:var(--linen); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:15px; position:relative;}
.card .title{font-weight:600; margin:0 0 6px; line-height:1.3;}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px;}
.chip{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.03em; padding:3px 7px; border-radius:100px; color:#fff; text-transform:uppercase;}
.chip.ig{background:#C97C7C;} .chip.fb{background:#5C7A9E;} .chip.tt{background:#2B2A28;} .chip.yt{background:#B23B3B;} .chip.xhs{background:var(--berry);}

.status-row{display:flex; align-items:center; gap:6px; margin-top:6px;}
.status-dot{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--ink-soft); cursor:pointer;}
.status-dot.idea{background:transparent;}
.status-dot.shot{background:var(--mustard); border-color:var(--mustard);}
.status-dot.posted{background:var(--teal); border-color:var(--teal);}
.status-label{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--ink-soft);}
.del{position:absolute; top:6px; right:6px; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:17px; line-height:1; opacity:.5;}
.del:hover{opacity:1;}

.gen-btn{width:100%; margin-top:8px; background:none; border:1px solid var(--mustard); color:#8a6c14; font-family:'Space Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.04em; padding:7px; border-radius:7px; cursor:pointer;}
.gen-btn:hover{background:var(--mustard); color:#fff;}
.gen-btn[disabled]{opacity:.6; cursor:wait;}
.gen-results{margin-top:8px; display:flex; flex-direction:column; gap:8px;}
.gen-block{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px;}
.gen-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;}
.gen-platform{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--berry); letter-spacing:.04em;}
.copy-btn{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; background:none; border:1px solid var(--line); border-radius:100px; padding:2px 8px; cursor:pointer; color:var(--ink-soft);}
.copy-btn:hover{border-color:var(--teal); color:var(--teal);}
.gen-text{font-size:14px; line-height:1.5; white-space:pre-wrap; margin:0;}
.gen-error{font-size:13px; color:var(--berry); font-style:italic;}

.add-btn{border:1.5px dashed var(--line); background:none; border-radius:10px; padding:9px; font-family:'Space Mono',monospace; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); cursor:pointer; margin-top:auto;}
.add-btn:hover{border-color:var(--berry); color:var(--berry);}

/* Idea bank */
.bank-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.idea-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px;}
.idea-pillar{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mustard); margin:0 0 6px;}
.idea-title{font-weight:600; font-size:17px; margin:0 0 10px; line-height:1.35;}
.use-btn{font-family:'Space Mono',monospace; font-size:12px; text-transform:uppercase; background:var(--ink); color:var(--linen); border:none; border-radius:100px; padding:7px 13px; cursor:pointer;}
.use-btn:hover{background:var(--berry);}

/* Modal */
.overlay{display:none; position:fixed; inset:0; background:rgba(43,42,40,.45); align-items:center; justify-content:center; z-index:50; padding:16px;}
.overlay.active{display:flex;}
.modal{background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:380px;}
.modal h3{font-family:'Instrument Serif',serif; font-weight:400; font-size:28px; margin:0 0 14px;}
.modal label{display:block; font-family:'Space Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:12px 0 5px;}
.modal input[type=text], .modal select, .modal textarea{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:16px; background:var(--linen); color:var(--ink);}
.modal textarea{resize:vertical; min-height:50px;}
.platform-checks{display:flex; flex-wrap:wrap; gap:8px;}
.platform-checks label{display:flex; align-items:center; gap:5px; font-family:'Inter'; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); margin:0;}
.modal-actions{display:flex; gap:8px; margin-top:18px;}
.modal-actions button{flex:1; padding:10px; border-radius:8px; border:none; font-family:'Space Mono',monospace; font-size:13px; text-transform:uppercase; cursor:pointer;}
.btn-save{background:var(--ink); color:var(--linen);}
.btn-cancel{background:transparent; color:var(--ink-soft); border:1px solid var(--line) !important;}

.empty{color:var(--ink-soft); font-size:14px; text-align:center; padding:20px 6px; font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="brand-eyebrow">Thread &amp; Beads</p>
      <h1>Content <em>Studio</em></h1>
      <p class="tagline">Plan the week, tag the platform, track it from idea to posted.</p>
    </div>
  </header>

  <div class="stitch"><svg viewBox="0 0 600 14" preserveAspectRatio="none"><line x1="0" y1="7" x2="600" y2="7" stroke="#C9A227" stroke-width="2" stroke-dasharray="10 8" stroke-linecap="round"/></svg></div>

  <nav class="tabs">
    <button class="active" data-view="calendar">This Week</button>
    <button data-view="bank">Idea Bank</button>
  </nav>

  <section id="view-calendar" class="view active">
    <div class="week-scroll" id="weekScroll"></div>
  </section>

  <section id="view-bank" class="view">
    <div class="bank-grid" id="bankGrid"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>New card</h3>
    <label>Title</label>
    <input type="text" id="mTitle" placeholder="e.g. Styling the amber clutch">
    <label>Content pillar</label>
    <select id="mPillar">
      <option>Product spotlight</option>
      <option>Process / behind-the-scenes</option>
      <option>Customer moment</option>
      <option>Style inspiration</option>
      <option>Founder story</option>
    </select>
    <label>Platforms</label>
    <div class="platform-checks">
      <label><input type="checkbox" value="ig"> Instagram</label>
      <label><input type="checkbox" value="tt"> TikTok</label>
      <label><input type="checkbox" value="fb"> Facebook</label>
      <label><input type="checkbox" value="yt"> YouTube</label>
      <label><input type="checkbox" value="xhs"> Xiaohongshu</label>
    </div>
    <label>Notes</label>
    <textarea id="mNotes" placeholder="Shot list, caption idea, hook..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveCard()">Add to day</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DEFAULT_PILLAR = {Mon:'Product spotlight', Tue:'', Wed:'Process / behind-the-scenes', Thu:'', Fri:'Style inspiration', Sat:'Stories only', Sun:'Stories only'};
const PLATFORM_LABEL = {ig:'IG', tt:'TikTok', fb:'FB', yt:'YT', xhs:'XHS'};

const IDEA_BANK = [
  {pillar:'Style inspiration', title:'3 ways to style this clutch for CNY / Hari Raya / weddings'},
  {pillar:'Process / behind-the-scenes', title:'Time-lapse of a bracelet being beaded start to finish'},
  {pillar:'Product spotlight', title:'"What\u2019s in my bag" using your own bag as the prop'},
  {pillar:'Customer moment', title:'Turn customer testimonial screenshots into a carousel'},
  {pillar:'Founder story', title:'Why I started Thread and Beads — the honest version'},
  {pillar:'Process / behind-the-scenes', title:'Packaging & unboxing, ASMR-style'},
  {pillar:'Product spotlight', title:'Close-up texture shots — stitching, clasps, bead knotting'},
  {pillar:'Style inspiration', title:'Bracelet stacking guide: mix metals, colours, textures'},
];

let state = JSON.parse(localStorage.getItem('tb_content_state') || '{}');
if(!state.cards) state.cards = {}; // { Mon: [ {id,title,pillar,platforms,notes,status} ] }
DAYS.forEach(d => { if(!state.cards[d]) state.cards[d] = []; });

function save(){ localStorage.setItem('tb_content_state', JSON.stringify(state)); }

function todayShort(){
  const map = {1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat',0:'Sun'};
  return map[new Date().getDay()];
}

function renderCalendar(){
  const el = document.getElementById('weekScroll');
  const today = todayShort();
  el.innerHTML = DAYS.map(day => {
    const cards = state.cards[day];
    const pillar = DEFAULT_PILLAR[day];
    return `<div class="day-col ${day===today?'today':''}">
      <div class="day-head">
        <span class="day-name">${day}${day===today?' · today':''}</span>
      </div>
      ${pillar ? `<span class="day-pillar">${pillar}</span>` : ''}
      <div class="cards">
        ${cards.length ? cards.map(c => renderCard(day,c)).join('') : ''}
      </div>
      <button class="add-btn" onclick="openModal('${day}')">+ Add content</button>
    </div>`;
  }).join('');
}

function renderCard(day, c){
  const chips = c.platforms.map(p => `<span class="chip ${p}">${PLATFORM_LABEL[p]}</span>`).join('');
  const statusText = {idea:'Idea', shot:'Shot', posted:'Posted'}[c.status];
  const genBtnLabel = c.generating ? 'Writing…' : (c.generated ? '↻ Regenerate captions' : '✨ Generate captions');
  return `<div class="card">
    <button class="del" onclick="deleteCard('${day}','${c.id}')">×</button>
    <p class="title">${escapeHtml(c.title)}</p>
    <div class="chips">${chips}</div>
    <div class="status-row">
      <span class="status-dot ${c.status}" onclick="cycleStatus('${day}','${c.id}')" title="Click to advance"></span>
      <span class="status-label">${statusText}</span>
    </div>
    <button class="gen-btn" ${c.generating?'disabled':''} onclick="generateContent('${day}','${c.id}')">${genBtnLabel}</button>
    ${c.genError ? `<p class="gen-error">${escapeHtml(c.genError)}</p>` : ''}
    ${c.generated ? renderGenResults(c) : ''}
  </div>`;
}

function renderGenResults(c){
  return `<div class="gen-results">
    ${c.platforms.map(p => {
      const text = c.generated[p] || '';
      const safeId = `${c.id}_${p}`;
      return `<div class="gen-block">
        <div class="gen-block-head">
          <span class="gen-platform">${PLATFORM_LABEL[p]}</span>
          <button class="copy-btn" onclick="copyGen('${safeId}')">Copy</button>
        </div>
        <p class="gen-text" id="gen_${safeId}">${escapeHtml(text)}</p>
      </div>`;
    }).join('')}
  </div>`;
}

function copyGen(safeId){
  const el = document.getElementById('gen_'+safeId);
  if(!el) return;
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const original = el.textContent;
    // brief visual confirmation via the copy button text is skipped for simplicity; clipboard write is enough
  });
}

async function generateContent(day, id){
  const card = state.cards[day].find(c => c.id === id);
  if(!card) return;
  card.generating = true; card.genError = null;
  save(); renderCalendar();

  const platformNames = card.platforms.map(p => ({ig:'Instagram (Reel or carousel caption)', tt:'TikTok (short video script + caption)', fb:'Facebook (community-style post)', yt:'YouTube Shorts (title + description)', xhs:'Xiaohongshu (RED — honest review-style caption in Chinese)'}[p])).join('; ');

  const prompt = `You are writing social media content for "Thread and Beads", a small Singapore-based handmade brand selling crystal bead bracelets and handmade bags/clutches (WhatsApp ordering, PDPA-compliant, warm and personal tone, not corporate).

Content idea: "${card.title}"
Content pillar: ${card.pillar}
Extra notes from the owner: ${card.notes || 'none'}

Write tailored content for these platforms: ${platformNames}

Rules:
- Match each platform's native tone (IG: warm/aesthetic with a hook line + relevant hashtags; TikTok: punchy hook + short scene-by-scene script; Facebook: slightly longer, community/local SG tone; YouTube Shorts: a title line then a short description; Xiaohongshu: write the caption in natural Chinese, review/recommendation style).
- Keep it authentic to a small handmade brand, not salesy or generic.
- Include a soft call-to-action to WhatsApp/DM to order where natural.
- Respond ONLY with a raw JSON object, no markdown fences, no preamble, with this exact shape: {"ig": "...", "tt": "...", "fb": "...", "yt": "...", "xhs": "..."} — only include keys for the platforms requested: ${card.platforms.join(', ')}`;

  try{
    const response = await fetch("https://property-funnel-proxy.ezyjac1.workers.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock) throw new Error('No response text');
    const clean = textBlock.text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    card.generated = parsed;
    card.genError = null;
  }catch(err){
    console.error('Generation error:', err);
    card.genError = "Couldn't generate right now — try again.";
  }finally{
    card.generating = false;
    save(); renderCalendar();
  }
}

function cycleStatus(day, id){
  const order = ['idea','shot','posted'];
  const card = state.cards[day].find(c => c.id === id);
  const idx = order.indexOf(card.status);
  card.status = order[(idx+1) % order.length];
  save(); renderCalendar();
}

function deleteCard(day, id){
  state.cards[day] = state.cards[day].filter(c => c.id !== id);
  save(); renderCalendar();
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

let modalDay = null;
function openModal(day, prefill){
  modalDay = day;
  document.getElementById('mTitle').value = prefill ? prefill.title : '';
  document.getElementById('mPillar').value = prefill ? prefill.pillar : 'Product spotlight';
  document.getElementById('mNotes').value = '';
  document.querySelectorAll('.platform-checks input').forEach(cb => cb.checked = false);
  document.getElementById('overlay').classList.add('active');
}
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }

function saveCard(){
  const title = document.getElementById('mTitle').value.trim();
  if(!title){ document.getElementById('mTitle').focus(); return; }
  const platforms = Array.from(document.querySelectorAll('.platform-checks input:checked')).map(cb => cb.value);
  const card = {
    id: 'c'+Date.now(),
    title,
    pillar: document.getElementById('mPillar').value,
    platforms: platforms.length ? platforms : ['ig'],
    notes: document.getElementById('mNotes').value.trim(),
    status: 'idea'
  };
  state.cards[modalDay].push(card);
  save(); renderCalendar(); closeModal();
}

function renderBank(){
  const el = document.getElementById('bankGrid');
  el.innerHTML = IDEA_BANK.map((idea, i) => `
    <div class="idea-card">
      <p class="idea-pillar">${idea.pillar}</p>
      <p class="idea-title">${idea.title}</p>
      <button class="use-btn" onclick='useIdea(${i})'>Add to ${todayShort()}</button>
    </div>
  `).join('');
}

function useIdea(i){
  const idea = IDEA_BANK[i];
  openModal(todayShort(), idea);
  switchView('calendar');
  setTimeout(()=>document.getElementById('overlay').classList.add('active'),0);
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
function switchView(view){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
}

document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeModal(); });

renderCalendar();
renderBank();
</script>
</body>
</html>
